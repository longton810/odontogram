<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dental Odontogram</title>
  <link rel="stylesheet" href="style.css?v=cervical-label-20261023">
</head>
<body>
  <div class="odontogram-grid">
    <div class="dentition-canvas">
      <div class="dentition-controls" aria-label="Dentition">
        <button type="button" class="dentition-button active" data-dentition="permanent" aria-pressed="true">Full permanent</button>
        <button type="button" class="dentition-button" data-dentition="primary" aria-pressed="false">Full primary</button>
        <button type="button" class="dentition-button" data-dentition="mixed" aria-pressed="false">Mixed</button>
      </div>
      <div class="arch" id="maxillary"></div>
      <div class="quadrant-horizontal-line"></div>
      <div class="arch" id="mandibular"></div>
      <div class="main-odontogram-controls">
        <button id="missingMain" class="finding whole-finding btn-missing" data-name="missing" aria-keyshortcuts="m">(M) Missing</button>
        <button id="changeAge" class="main-control-button">Change Age</button>
      </div>
    </div>
    <section class="clinical-panel odontogram-findings">
      <h2>Findings</h2>
      <div class="finding-section">
        <div class="finding-row nsf-row">
          <button class="finding whole-finding btn-nsf" data-name="NSF" aria-keyshortcuts="n" title="Select a tooth and press N">(N) No significant finding</button>
        </div>
        <div class="finding-row"><span class="finding-label">Caries:</span>
          <button class="finding surface-finding btn-caries" data-name="decay" aria-keyshortcuts="d">(D) Decay</button>
          <button class="finding surface-finding btn-decalcified" data-name="decalcified">Decalcified</button>
          <button class="finding surface-finding btn-stain" data-name="stain">Stain</button>
          <button class="finding surface-finding btn-incipient" data-name="incipient caries" aria-keyshortcuts="i">(I) Incipient</button>
          <button class="finding surface-finding btn-recurrent" data-name="recurrent caries">Recurrent</button>
          <button class="finding surface-finding btn-gross" data-name="gross caries">Gross</button>
        </div>
        <div class="finding-row"><span class="finding-label">Existing material:</span>
<span class="existing-material-group"><button class="finding surface-finding btn-composite" data-name="composite" aria-keyshortcuts="c">(C) Composite</button>
<button class="finding surface-finding btn-amalgam" data-name="amalgam" aria-keyshortcuts="a">(A) Amalgam</button>
<button class="finding surface-finding btn-sealant" data-name="sealant">Sealant</button>
<button class="finding surface-finding btn-irm" data-name="IRM">IRM</button></span>
<span class="existing-material-divider" aria-hidden="true">|</span>
<span class="existing-material-group"><button class="finding whole-finding btn-ssc" data-name="SSC">SSC</button>
<button class="finding whole-finding btn-zirconia" data-name="Zirconia crown" aria-keyshortcuts="z">(Z) Zirconia</button>
<button class="finding whole-finding btn-pfm" data-name="PFM crown" aria-keyshortcuts="p">(P) PFM</button>
<button class="finding whole-finding btn-metal" data-name="Metal crown">Metal</button>
<button class="finding whole-finding btn-bridge" data-name="Bridge" aria-keyshortcuts="b">(B) Bridge</button>
<button class="finding whole-finding btn-implant" data-name="implant">Implant</button></span>
</div>
        <div class="finding-row"><span class="finding-label">Endo:</span>
          <button class="finding whole-finding btn-rct" data-name="RCT" aria-keyshortcuts="r">(R) RCT</button>
          <button class="finding whole-finding btn-post-core" data-name="post & core">Post & Core</button>
          <button class="finding whole-finding btn-root-tip" data-name="root tip" aria-keyshortcuts="t">(T) Root Tip</button>
          <button class="finding whole-finding btn-parl" data-name="PARL">PARL</button>
          <button class="finding whole-finding btn-paro" data-name="PARO">PARO</button>
          <button class="finding whole-finding btn-ankylosis" data-name="ankylosis">Ankylosis</button>
        </div>
        <div class="finding-row noncarious-row"><span class="finding-label">Non-carious:</span>
<span class="noncarious-group"><button class="finding surface-finding btn-pit" data-name="pit">Pit</button>
<button class="finding surface-finding btn-deep-groove" data-name="deep groove">Deep groove</button></span>
<span class="noncarious-divider" aria-hidden="true">|</span>
<span class="noncarious-group"><button class="finding whole-finding btn-wear" data-name="wear">Wear/Abrasion</button>
<button class="finding surface-finding btn-abfraction" data-name="abfraction">Abfraction</button>
<button class="finding surface-finding btn-erosion" data-name="erosion">Erosion</button></span>
<span class="noncarious-divider" aria-hidden="true">|</span>
<span class="noncarious-group"><button class="finding surface-finding btn-chipped" data-name="chipped">Chipped</button>
<button class="finding surface-finding btn-crack" data-name="crack line">Crack line</button>
<button class="finding surface-finding btn-broken" data-name="broken">Broken</button></span>
<span class="noncarious-divider" aria-hidden="true">|</span>
<span class="noncarious-group"><button class="finding surface-finding btn-overhang" data-name="overhang">Overhang</button>
<button class="finding surface-finding btn-open-margin" data-name="open margin">Open margin</button>
<button class="finding surface-finding btn-short-margin" data-name="short margin">Short margin</button>
<button class="finding surface-finding btn-rest-seat" data-name="rest seat">Rest seat</button></span>
</div>
        <div class="finding-row"><span class="finding-label">Position:</span>
          <button class="finding whole-finding position-button" data-name="mobility">Mobility</button>
          <button class="finding whole-finding position-button" data-name="tilted">Tilted</button>
          <button class="finding whole-finding position-button" data-name="rotated">Rotated</button>
          <button class="finding whole-finding position-button" data-name="super-eruption">Super-eruption</button>
          <button class="finding whole-finding position-button" data-name="erupting">Erupting</button>
          <button class="finding whole-finding position-button" data-name="impacted">Impacted</button>
          <button class="finding whole-finding position-button" data-name="unerupted">Unerupted</button>
          <button class="finding whole-finding position-button" data-name="pericoronitis">Pericoronitis</button>
        </div>
      </div>
    </section>
  </div>
  <div class="clinical-panels treatment-panels">
    <section class="clinical-panel">
      <h2>Suggested treatment</h2>
      <div class="treatment-section">
        <div class="finding-row"><span class="finding-label">Conservative:</span>
          <button type="button" class="treatment watch-treatment btn-watch" data-treatment="Watch" aria-keyshortcuts="w">(W) Watch</button>
          <button type="button" class="treatment surface-treatment btn-sdf" data-treatment="SDF">SDF</button>
          <button type="button" class="treatment surface-treatment btn-sealant" data-treatment="Sealant">Sealant</button>
        </div>
        <div class="finding-row treatment-single-line"><span class="finding-label">Restoration:</span>
          <button type="button" class="treatment surface-treatment btn-composite" data-treatment="Composite" aria-keyshortcuts="f">(F) Composite</button>
          <button type="button" class="treatment surface-treatment btn-amalgam" data-treatment="Amalgam">Amalgam</button>
          <button type="button" class="treatment surface-treatment btn-rmgi" data-treatment="RMGI">RMGI</button>
          <button type="button" class="treatment surface-treatment btn-irm" data-treatment="IRM">IRM</button>
        </div>
        <div class="finding-row"><span class="finding-label">Endo:</span>
          <button type="button" class="treatment whole-treatment btn-rct" data-treatment="Pulpotomy">Pulpotomy</button>
          <button type="button" class="treatment whole-treatment btn-rct" data-treatment="RCT">RCT</button>
          <button type="button" class="treatment whole-treatment btn-post-core" data-treatment="post & core">post & core</button>
        </div>
        <div class="finding-row"><span class="finding-label">Crown/FPD:</span>
          <button type="button" class="treatment whole-treatment btn-cbu" data-treatment="CBU">CBU</button>
          <button type="button" class="treatment whole-treatment btn-ssc" data-treatment="SSC">SSC</button>
          <button type="button" class="treatment whole-treatment btn-zirconia" data-treatment="Zirconia">Zirconia</button>
          <button type="button" class="treatment whole-treatment btn-pfm" data-treatment="PFM">PFM</button>
          <button type="button" class="treatment whole-treatment btn-metal" data-treatment="Metal">Metal</button>
          <button type="button" class="treatment whole-treatment btn-bridge" data-treatment="Bridge">Bridge</button>
        </div>
        <div class="finding-row treatment-single-line"><span class="finding-label">OS:</span>
          <button type="button" class="treatment whole-treatment btn-extraction" data-treatment="Extraction" aria-keyshortcuts="e">(E) Extraction</button>
          <button type="button" class="treatment whole-treatment btn-lengthening" data-treatment="Crown lengthening">Crown lengthening</button>
          <button type="button" class="treatment whole-treatment btn-implant" data-treatment="Implant">Implant</button>
        </div>
      </div>
    </section>
  </div>
  <h2>Note</h2>
  <div id="output"></div>
  <div class="chart-controls">
    <button id="copyChart">Copy Note</button>
    <button id="undo">Undo Last</button>
  </div>
  <div id="copyMessage"></div>
  <div class="clear-all-area">
    <button id="clearAll" type="button">Clear All</button>
  </div>
  <dialog id="clearAllDialog" aria-labelledby="clearAllTitle" aria-describedby="clearAllDescription">
    <h3 id="clearAllTitle">Clear all data?</h3>
    <p id="clearAllDescription">Delete all findings, treatments, and chart notes, and reset tooth settings? This cannot be undone.</p>
    <div class="clear-all-actions">
      <button id="cancelClearAll" type="button" autofocus>No, keep data</button>
      <button id="confirmClearAll" type="button">Yes, delete all</button>
    </div>
  </dialog>

<script>
// Preserve one line per category without adding horizontal scrolling.
(() => {
  const sections = [...document.querySelectorAll('.finding-section, .treatment-section, .rx-tooth-lines')];
  let frame;
  const fit = () => {
    frame = null;
    sections.forEach(section => {
      if (!section.clientWidth) return;
      const sectionStyle = getComputedStyle(section);
      const sectionWidth = section.clientWidth - parseFloat(sectionStyle.paddingLeft) - parseFloat(sectionStyle.paddingRight);
      section.querySelectorAll('.finding-row, .rx-tooth-options:not(.rx-wear-options)').forEach(row => {
        row.classList.add('fit-category-line');
        row.style.zoom = '1';
        // A category may be inside a smaller multi-column finding group.
        let available = sectionWidth;
        for (let parent = row.parentElement; parent && parent !== section; parent = parent.parentElement) {
          if (getComputedStyle(parent).display === 'contents') continue;
          const style = getComputedStyle(parent);
          const width = parent.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
          if (width > 0) available = Math.min(available, width);
        }
        const natural = Math.max(row.offsetWidth, row.scrollWidth);
        row.style.zoom = String(Math.min(1, Math.max(0, available - 2) / (natural || 1)));
      });
    });
  };
  const schedule = () => { if (!frame) frame = requestAnimationFrame(fit); };
  const widths = new WeakMap();
  const observer = new ResizeObserver(entries => {
    entries.forEach(entry => {
      if (widths.get(entry.target) !== entry.contentRect.width) {
        widths.set(entry.target, entry.contentRect.width); schedule();
      }
    });
  });
  sections.forEach(section => observer.observe(section));
  window.addEventListener('resize', schedule);
  if (document.fonts) document.fonts.ready.then(schedule);
  schedule();
})();
</script>
</body>
</html>
